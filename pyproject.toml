[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (tri des imports)
    "UP",  # pyupgrade (syntaxe moderne, équivalent rector)
    "B",   # flake8-bugbear (pièges courants)
    "SIM", # flake8-simplify
]
# B024/B027 : Display expose des hooks optionnels (start/refresh/stop) que
# les sous-classes surchargent seulement si besoin — pas de vraie méthode
# abstraite à forcer, voir src/display.py.
ignore = ["B024", "B027"]

[tool.ruff.lint.per-file-ignores]
# sys.path.insert(...) avant les imports : nécessaire pour exécuter le
# script directement (voir tests/README.md), pas une vraie violation.
"tests/render_example.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

